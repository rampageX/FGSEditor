name: Build FGSEditor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib numpy Nuitka
          python -m pip install .

      - name: Unit checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Obtain integration tools
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/rampageX/grav1synth/releases/tags/v0.2.2
          $asset = $release.assets | Where-Object { $_.name -match 'windows' -and $_.name -match 'zip$' -and $_.name -notmatch 'arm|aarch' } | Select-Object -First 1
          if (-not $asset) { throw 'No Windows grav1synth ZIP asset found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile grav1synth.zip
          Expand-Archive grav1synth.zip integration-tools/grav1synth
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip integration-tools/ffmpeg
          $grav = (Get-ChildItem integration-tools/grav1synth -Recurse -Filter grav1synth.exe | Select-Object -First 1).FullName
          $ffmpeg = (Get-ChildItem integration-tools/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem integration-tools/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          "TEST_GRAV1SYNTH=$grav" >> $env:GITHUB_ENV
          "TEST_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV
          "TEST_FFPROBE=$ffprobe" >> $env:GITHUB_ENV
          "GRAV1SYNTH_TAG=$($release.tag_name)" >> $env:GITHUB_ENV

      - name: Real AV1 apply integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/integration_apply.py

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with Nuitka
        shell: cmd
        run: |
          python -m nuitka --standalone --windows-console-mode=disable ^
            --plugin-enable=pyside6 ^
            --windows-icon-from-ico=icon.ico ^
            --windows-company-name="PingWer" ^
            --windows-product-name="FGSEditor" ^
            --windows-file-version="4.0.0.0" ^
            --windows-product-version="4.0.0.0" ^
            --windows-file-description="Film Grain Strength Editor" ^
            --output-dir=dist fgseditor_qt/fgsview_loader.py ^
            --include-package=fgseditor_qt ^
            --output-filename=FGSEditor.exe ^
            --assume-yes-for-downloads ^
            --include-windows-runtime-dlls=no ^
            --include-data-files=icon.ico=icon.ico

      - name: Prepare artifact
        shell: pwsh
        run: |
          mkdir release
          Move-Item -Path dist/fgsview_loader.dist -Destination release/FGSEditor
          Copy-Item -Path FGS_grain_size  -Destination release/FGSEditor/FGS_grain_size  -Recurse
          Copy-Item -Path Templates       -Destination release/FGSEditor/Templates        -Recurse
          Copy-Item -Path NOTICE.md       -Destination release/FGSEditor/NOTICE.md
          Copy-Item README.md, CHANGELOG.md -Destination release/FGSEditor/
          Copy-Item $env:TEST_FFMPEG, $env:TEST_FFPROBE -Destination release/FGSEditor/
          $ffmpegRoot = Split-Path (Split-Path $env:TEST_FFMPEG)
          New-Item -ItemType Directory release/FGSEditor/FFmpeg-notices
          Get-ChildItem $ffmpegRoot -File | Copy-Item -Destination release/FGSEditor/FFmpeg-notices/
          Copy-Item (Split-Path $env:TEST_GRAV1SYNTH)/* -Destination release/FGSEditor/ -Recurse -Force
          "Commit: $env:GITHUB_SHA`nGrav1synth: $env:GRAV1SYNTH_TAG" | Set-Content release/FGSEditor/BUILD_INFO.txt

      - name: Packaged Windows launch smoke check
        shell: pwsh
        run: |
          $exe = (Resolve-Path release/FGSEditor/FGSEditor.exe).Path
          $process = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged application exited: $($process.ExitCode)" }
            if ($process.MainWindowTitle -notlike '*FGSEditor*') { throw 'Main FGSEditor window was not created' }
            Write-Host "PASS: packaged main window: $($process.MainWindowTitle)"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Remove-Item release/FGSEditor/settings.json -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FGSEditor-Windows
          path: release/

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-cursor0 libxcb-shape0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1-mesa-glx libglib2.0-0 \
            libfontconfig1 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          PYTHONPATH=. pyinstaller --noconfirm --onefile --noconsole \
            --name "FGSEditor" \
            --add-data "icon.ico:." \
            --paths "." \
            fgseditor_qt/fgsview_loader.py

      - name: Prepare artifact
        run: |
          mkdir -p release/FGSEditor
          cp dist/FGSEditor release/FGSEditor/
          cp -r FGS_grain_size  release/FGSEditor/FGS_grain_size
          cp -r Templates       release/FGSEditor/Templates
          cp    NOTICE.md       release/FGSEditor/NOTICE.md
          cp    settings.json   release/FGSEditor/settings.json || true
          chmod +x release/FGSEditor/FGSEditor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FGSEditor-Linux
          path: release/
